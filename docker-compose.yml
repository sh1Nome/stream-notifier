services:
  node:
    image: 'node:23'
    init: true
    user: 'node'
    command: 'tail -f /dev/null'
  jdk:
    build: .
    init: true
    volumes:
      - './work:/home/work'
    env_file:
      - './.env'
  db:
    image: 'postgres:16'
    user: 'postgres'
    volumes:
      - './data:/var/lib/postgresql/data'
    env_file:
      - './.env'
  adminer:
    image: 'adminer'
    ports:
      - '49152:8080'
